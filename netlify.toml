[build]
  publish = "."

# No build command needed for static HTML

# Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[functions]
  directory = "netlify/functions"

# Publish dir is the repo root, so function source would otherwise be static.
# Force 404 for /netlify/*; /.netlify/functions/* is the function endpoint.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# PP27 sales page on vip.soniagomez.net/workshop (James OK Oct 23 2026, 6:21 PM COT, "set up b").
# Proxy (status 200) to the Cloudflare Worker abb-join-live. No DNS change. Checkout links stay on pay.authoritybrandbuilder.com.
# The page's only other root-relative URLs are its /_a/ images. Its tracking relay posts to https://join.authoritybrandbuilder.com directly.
[[redirects]]
  from = "/workshop"
  to = "https://join.authoritybrandbuilder.com/perfect-pitch-workshop"
  status = 200
  force = true

[[redirects]]
  from = "/workshop/"
  to = "https://join.authoritybrandbuilder.com/perfect-pitch-workshop"
  status = 200
  force = true

[[redirects]]
  from = "/_a/*"
  to = "https://join.authoritybrandbuilder.com/_a/:splat"
  status = 200
  force = true

# Cloudflare Web Analytics beacon (zone-injected into the proxied join page) posts to same-origin /cdn-cgi/rum; forward it to join so it does not 404.
[[redirects]]
  from = "/cdn-cgi/rum"
  to = "https://join.authoritybrandbuilder.com/cdn-cgi/rum"
  status = 200
  force = true

# The Swipe File PDF (PP27 bump 2 delivery) on vip.soniagomez.net/files/<token>/the-swipe-file.pdf.
# Proxied (status 200) to the static asset on Cloudflare Worker abb-join-live (James OK Oct 24 2026, 10:07 PM COT: "Use the vip.soniagomez.net link").
# Unknown paths under /files/ 404 at join. No file in this repo lives under /files/.
[[redirects]]
  from = "/files/*"
  to = "https://join.authoritybrandbuilder.com/files/:splat"
  status = 200
  force = true

# PP27 "you're set" confirmation page for the GHL trigger links 'PP27 link OK' and 'PP27 I'm coming' (James go Oct 25 2026, 5:08 PM COT; vip host 5:11 PM COT).
# Proxied (status 200) to Cloudflare Worker abb-join-live /pp27-youre-set. noindex, no nav, no pixel. The page has no root-relative URLs.
[[redirects]]
  from = "/youre-set"
  to = "https://join.authoritybrandbuilder.com/pp27-youre-set"
  status = 200
  force = true

[[redirects]]
  from = "/youre-set/"
  to = "https://join.authoritybrandbuilder.com/pp27-youre-set"
  status = 200
  force = true

# Privacy Policy for You Prosper LLC / Authority Brand Builder (James OK Oct 25 2026, 6:36 PM COT, Marcus chat: "Can you guys create the privacy policy link? Host it wherever it needs to be hosted?").
# Needed for the Meta app to go Live. Static page in this repo at pages/privacy/index.html. /privacy serves it (200), /privacy/ 301s to /privacy.
[[redirects]]
  from = "/privacy"
  to = "/pages/privacy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301
  force = true

