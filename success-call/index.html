<script>
(function(){
  var fired=false;
  var frame=document.getElementById('YezNdONJGkx9dSAMimut_1761256800000');
  window.addEventListener('message',function(e){
    if(fired||!frame||e.source!==frame.contentWindow)return;
    var d=e.data;
    if(Array.isArray(d)&&d[0]==='msgsndr-booking-complete'&&!(d[1]&&d[1].calendarId&&d[1].calendarId!=='YezNdONJGkx9dSAMimut')){
      fired=true;
      var id=window.sgTrack('Schedule',{content_name:'Success Call with Sonia'});
      try{sessionStorage.setItem('sg_schedule_event_id',id);}catch(_){}
    }
  });
})();
